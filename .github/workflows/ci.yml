name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per main commit: GitHub cancels all but one pending run in a group.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  crap:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nupkg
          path: nupkg

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-results
          path: TestResults

      - name: Install dotnet-crap from this run's package
        run: dotnet tool install -g Crap4DotNet --configfile nuget.ci.config --prerelease

      - name: Analyze
        run: |
          # The TRX logger copies each coverage file into In/. Skip the copies.
          mapfile -t coverage < <(find TestResults -name coverage.cobertura.xml -not -path '*/In/*')
          dotnet-crap analyze crap4dotnet.sln --coverage "${coverage[@]}" --output crap-report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: crap-report
          path: crap-report.json
          if-no-files-found: ignore
