name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  crap:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base commit is checked out below

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nupkg
          path: nupkg

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-results
          path: TestResults

      # Installing from the packed artifact checks that the package installs, and analyzes
      # with this build rather than the release on nuget.org.
      - name: Install dotnet-crap
        run: dotnet tool install -g Crap4DotNet --configfile nuget.ci.config --prerelease

      - name: Analyze
        run: .github/scripts/crap-analyze.sh . TestResults crap-report.json

      # The base is analyzed with this PR's tool, so the diff shows only code changes,
      # not changes in how the tool scores. Coverlet measures branches in the IL, so the
      # base must be built like the PR: same SDK, an explicit Release build, then test.
      # `dotnet test -c Release` without a prior build produced Debug assemblies here.
      - name: Analyze base
        if: github.event_name == 'pull_request'
        run: |
          base="$RUNNER_TEMP/base"
          git worktree add "$base" "${{ github.event.pull_request.base.sha }}"
          cp global.json "$base/"
          dotnet build "$base/crap4dotnet.sln" -c Release
          dotnet test "$base/crap4dotnet.sln" -c Release --no-build \
            --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/base-results"
          .github/scripts/crap-analyze.sh "$base" "$RUNNER_TEMP/base-results" crap-base.json

      - name: Fail on new CRAPpy methods
        if: github.event_name == 'pull_request'
        run: |
          set +e
          dotnet-crap diff crap-base.json crap-report.json --output crap-diff.json
          code=$?
          set -e
          {
            echo '### CRAP diff against base'
            echo '```json'
            jq '.summary' crap-diff.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: crap-reports
          path: crap-*.json
          if-no-files-found: ignore
