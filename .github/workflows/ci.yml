name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its older run. Each main commit gets its own group, because
  # GitHub keeps only one pending run per group and drops the rest.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  crap:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the base commit is checked out below
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nupkg
          path: nupkg

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-results
          path: TestResults

      # Installing from the packed artifact checks that the package installs, and analyzes
      # with this build rather than the release on nuget.org.
      - name: Install dotnet-crap
        run: dotnet tool install -g Crap4DotNet --configfile nuget.ci.config --prerelease

      - name: Analyze
        run: .github/scripts/crap-analyze.sh . TestResults crap-report.json

      # The base is analyzed with this PR's tool, SDK and config, so the diff shows only code
      # changes, not changes in scoring, threshold or compiled IL.
      - name: Analyze base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$RUNNER_TEMP/base"
          git worktree add "$base" "$BASE_SHA"
          cp global.json crap4dotnet-config.json "$base/"
          .github/scripts/build-and-test.sh "$base" "$RUNNER_TEMP/base-results"
          .github/scripts/crap-analyze.sh "$base" "$RUNNER_TEMP/base-results" crap-base.json

      - name: Fail on new or worse CRAPpy methods
        if: github.event_name == 'pull_request'
        run: .github/scripts/crap-diff.sh crap-base.json crap-report.json crap-diff.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: crap-reports
          path: crap-*.json
          if-no-files-found: ignore
