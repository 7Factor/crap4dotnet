name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Pack CLI tool
        run: dotnet pack src/Crap4DotNet.Cli -o ./nupkg

      - name: Install dotnet-crap
        run: dotnet tool install -g Crap4DotNet --add-source ./nupkg

      - name: Self-analyze with CRAP metrics
        continue-on-error: true
        run: dotnet-crap analyze ./crap4dotnet.sln --run-tests
